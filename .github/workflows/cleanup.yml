name: Cleanup old DB snapshots

# Removes snapshots (releases + their tags) older than N years. CVE data that old is obsolete for
# any bundle we still support, so it is not worth keeping. Runs monthly, shortly after the snapshot.

on:
  schedule:
    - cron: '30 6 1 * *'         # 06:30 UTC on the 1st, just after the snapshot job
  workflow_dispatch:
    inputs:
      max_age_years:
        description: 'Delete snapshots older than this many years'
        required: false
        default: '5'

permissions:
  contents: write                # delete releases/tags in THIS repo

jobs:
  cleanup:
    name: Delete snapshots older than N years
    runs-on: ubuntu-latest
    steps:
      - name: Delete old snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAX_AGE_YEARS: ${{ github.event.inputs.max_age_years || '5' }}
        shell: bash
        run: |
          set -euo pipefail
          cy=$(date -u +%Y); cm=$(date -u +%m)
          # cutoff as an integer YYYYMM: anything strictly older is deleted
          cutoff=$(( (cy - MAX_AGE_YEARS) * 100 + 10#$cm ))
          echo "Today: ${cy}.${cm}  ·  cutoff (YYYYMM): $cutoff  ·  max age: ${MAX_AGE_YEARS}y"
          deleted=0
          while read -r tag; do
            [[ "$tag" =~ ^([0-9]{4})\.([0-9]{2})$ ]] || { echo "skip non-snapshot tag: $tag"; continue; }
            ym=$(( 10#${BASH_REMATCH[1]} * 100 + 10#${BASH_REMATCH[2]} ))
            if (( ym < cutoff )); then
              echo "Deleting $tag"
              gh release delete "$tag" --yes --cleanup-tag
              deleted=$((deleted + 1))
            fi
          done < <(gh release list --limit 500 --json tagName -q '.[].tagName')
          echo "Deleted $deleted snapshot(s)."
